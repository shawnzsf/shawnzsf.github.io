    <div class="paper-grain" id="paperGrain" aria-hidden="true"></div>
    <svg class="paper-grain-defs" aria-hidden="true" style="position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;z-index:-1;opacity:0;">
        <defs>
            <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="noise" />

                    0.25 0 0 0 0.12
                    0 0.25 0 0 0.09
                    0 0 0.25 0 0.06
                    0 0 0 0.45 0" result="coloredNoise" />
                <feTurbulence type="fractalNoise" baseFrequency="0.025 0.5" numOctaves="3" stitchTiles="stitch" result="fibers" />
                <feColorMatrix type="matrix" values="
                    0 0 0 0 0.16
                    0 0 0 0 0.11
                    0 0 0 0 0.07
                    0 0 0 0.35 0" result="coloredFibers" />
                <feBlend mode="multiply" in="coloredNoise" in2="coloredFibers" result="paperSurface" />
            </filter>
        </defs>
    </svg>
